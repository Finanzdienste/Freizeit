# Bei jedem Push: Linter, die Datendateien und alle Browsertests.
#
# Läuft auch nach jedem Datenlauf (montags: die Woche und die Konzerte).
# Die Läufe prüfen ihre Datei vorher selbst mit tests/test-daten.mjs; das
# hier ist die zweite Meinung, mit der App im Browser.
name: Prüfung

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    name: Linter und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Linter
        run: npm run lint

      - name: Datendateien
        run: node tests/test-daten.mjs

      # Nur Chromium: Die App ist fürs Handy, und Chrome ist der Browser,
      # aus dem sie installiert wird.
      - run: npx playwright install --with-deps chromium

      - name: Alle Tests
        run: node tests/lauf.mjs
