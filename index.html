<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6f69">
<meta name="description" content="Was in Hamburg und Umgebung diese Woche los ist, die Konzerte deiner Künstler und deine Merkliste.">
<title>Freizeit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="kopf">
  <div class="kopf-in">
    <h1 class="marke-app"><img src="icon.svg" alt="">Freizeit</h1>
    <span class="stand" id="stand"></span>
  </div>
</header>

<main id="ansicht" class="ansicht" tabindex="-1"></main>

<!-- Die Reiter stehen fest im HTML, damit die App auch mit einem Skript aus
     einem älteren Zwischenspeicher eine Navigation hat – dieselbe Vorsicht wie
     in der Workout-App. -->
<nav class="reiterleiste" aria-label="Bereiche">
  <button type="button" class="reiter" data-reiter="woche" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Diese Woche</span>
  </button>
  <button type="button" class="reiter" data-reiter="konzerte">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
    <span>Konzerte</span><span class="punkt" id="konzerte-neu" hidden title="neue Konzerte"></span>
  </button>
  <button type="button" class="reiter" data-reiter="merkliste">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4-6 4V4.5a1 1 0 0 1 1-1z"/></svg>
    <span>Merkliste</span><span class="zahl" id="merkzahl"></span>
  </button>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
