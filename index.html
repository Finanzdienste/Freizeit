<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6f69">
<meta name="description" content="Was in Hamburg und Umgebung los ist – als Liste, Monat, Woche und Tag, auf der Karte, mit Ideen für alles ohne Termin und gemeinsam geplant.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Freizeit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Freizeit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="kopf">
  <div class="kopf-in">
    <h1 class="marke-app"><img src="icon.svg" alt="">Freizeit</h1>
  </div>
</header>

<main id="ansicht" class="ansicht" tabindex="-1"></main>

<!-- Das Filter-Blatt (js/blatt.js) – außerhalb von main, damit es beim Neuzeichnen stehen bleibt. -->
<div id="blatt-ort"></div>

<!-- Die Reiter stehen fest im HTML, damit die App auch mit einem Skript aus
     einem älteren Zwischenspeicher eine Navigation hat. Welche davon zu sehen
     sind, stellt man unter Einstellungen ein (js/app.js setzt hidden);
     Einstellungen selbst ist immer da. -->
<nav class="reiterleiste" aria-label="Bereiche">
  <button type="button" class="reiter" data-reiter="programm" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
    <span>Programm</span>
  </button>
  <button type="button" class="reiter" data-reiter="karte">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
    <span>Karte</span>
  </button>
  <button type="button" class="reiter" data-reiter="ideen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.7 10.7c.8.7 1.2 1.5 1.2 2.3v.5h5V16c0-.8.4-1.6 1.2-2.3A6 6 0 0 0 12 3z"/></svg>
    <span>Ideen</span>
  </button>
  <button type="button" class="reiter" data-reiter="wir">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>
    <span>Wir</span><span class="punkt" id="wir-neu" hidden title="neue Haken"></span>
  </button>
  <button type="button" class="reiter" data-reiter="einstellungen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.2 12.9L21.6 14.2L20.3 17.2L17.8 16.5A7.3 7.3 0 0 1 16.5 17.8L17.2 20.3L14.2 21.6L12.9 19.2A7.3 7.3 0 0 1 11.1 19.2L9.8 21.6L6.8 20.3L7.5 17.8A7.3 7.3 0 0 1 6.2 16.5L3.7 17.2L2.4 14.2L4.8 12.9A7.3 7.3 0 0 1 4.8 11.1L2.4 9.8L3.7 6.8L6.2 7.5A7.3 7.3 0 0 1 7.5 6.2L6.8 3.7L9.8 2.4L11.1 4.8A7.3 7.3 0 0 1 12.9 4.8L14.2 2.4L17.2 3.7L16.5 6.2A7.3 7.3 0 0 1 17.8 7.5L20.3 6.8L21.6 9.8L19.2 11.1A7.3 7.3 0 0 1 19.2 12.9Z"/><circle cx="12" cy="12" r="3.2"/></svg>
    <span>Einstellungen</span>
  </button>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
